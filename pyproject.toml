[build-system]
# PEP 639 (SPDX license expressions and license-files) requires setuptools 77;
# immlib requires Python 3.10, so there is no need for the older-setuptools
# fallback that a Python 3.8-compatible project would need.
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "immlib"
version = "1.0.0rc1"
description = """A library of utilities for immutable scientific data."""
authors = [{name="Noah C. Benson", email="nben@uw.edu"}]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["persistent", "immutable", "functional", "scientific", "workflow"]
classifiers = [
    'Intended Audience :: Science/Research',
    'Intended Audience :: Developers',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Topic :: Software Development',
    'Topic :: Software Development :: Libraries',
    'Topic :: Software Development :: Libraries :: Python Modules',
    'Topic :: Scientific/Engineering',
    'Topic :: Scientific/Engineering :: Information Analysis',
    'Operating System :: Microsoft :: Windows',
    'Operating System :: POSIX',
    'Operating System :: Unix',
    'Operating System :: MacOS']
dependencies = [
     'pcollections >= 1.0.0rc1',
     'numpy >= 1.24.0',
     # The sparse *array* classes (scipy.sparse.csr_array, etc.) that
     # immlib.util._numeric uses to describe sparse layouts were added in
     # scipy 1.8.0.
     'scipy >= 1.8.0',
     # immlib.Quantity subclasses pint.Quantity and overrides some of Pint's
     # private methods and attributes (see immlib.util._quantity), so an upper
     # bound is kept to the minor series it has been tested against. The test
     # suite passes against pint 0.24.4, 0.25.3, and 0.26.1 (see the "Pint
     # contract" tests in immlib.test.util.test_pint); note that pint 0.25+
     # requires Python 3.11 and pint 0.26+ requires Python 3.12, so a Python
     # 3.10 install resolves to pint 0.24.x.
     'pint >= 0.24.0, < 0.27',
     'docshare >= 0.2.0',
     'joblib >= 1.3.0',
     # immlib reaches into a few cloudpathlib internals (notably the private
     # Client._local_cache_dir, and the CloudPath._no_prefix helpers), so an
     # upper bound is kept to the minor series it has been tested against
     # (0.25.0).
     'cloudpathlib[s3,gs,azure] >= 0.18.0, < 0.26',
     'pyyaml >= 6.0']

[project.optional-dependencies]
dev = ["torch >= 2.2.0", "pandas >= 1.5.0", "mypy >= 1.8"]
# pandas is needed only by the csv/tsv formats of immlib.save/immlib.load, so
# it is an optional dependency of the library and a test dependency of the
# suite (which exercises those formats when pandas is present).
test = ["torch >= 2.2.0", "pandas >= 1.5.0"]
pandas = ["pandas >= 1.5.0"]
# Jupyter Book 2 builds with mystmd and uses its own myst.yml configuration
# (the docs were migrated from Jupyter Book 1); the API-reference pages are
# generated by docs/generate_api.py before the book is built.
docs = ["torch >= 2.2.0", "matplotlib >= 3.4.0", "jupyter-book >= 2"]

[tool.setuptools.package-data]
# Distribute the PEP 561 marker alongside the package, so that type checkers
# know immlib's inline annotations are usable.
immlib = ["py.typed"]

[tool.mypy]
# immlib is annotated progressively, so the checker is kept lenient on bodies
# that are not annotated yet; the point of running it in CI is to keep the
# annotations that do exist honest, not to require every function to have them.
#
# The target Python version is deliberately not pinned: mypy then follows the
# interpreter that runs it. Pinning it to an older version makes mypy parse
# with that version's grammar, which fails on dependency stubs that use newer
# syntax (numpy's stubs use PEP 695 `type` statements, which need 3.12+), and
# the CI matrix checks the annotations under more than one interpreter.
files = ["src/immlib"]
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false

[project.urls]
homepage = "https://github.com/noahbenson/immlib"
documentation = "https://github.com/noahbenson/immlib"
repository = "https://github.com/noahbenson/immlib"
