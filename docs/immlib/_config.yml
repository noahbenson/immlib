################################################################################
# A default configuration that will be loaded for all jupyter books
# See the documentation for help and more options: 
# https://jupyterbook.org/customize/config.html

################################################################################
# Book settings

title     : "immlib: An Immutable Scientific Workflow Library"
author    : Noah C. Benson  
copyright : "2025"
logo      : logo.svg

# Force re-execution of notebooks on each build.
# See https://jupyterbook.org/content/execute.html
execute:
  execute_notebooks: force
  # A handful of pages trigger a stderr FutureWarning on `import immlib`
  # (from a google-api-core dependency pulled in by the optional Google
  # Cloud Storage support in immlib.iolib, unrelated to anything the
  # docs page itself is demonstrating). 'remove-warn' drops that stderr
  # text from the rendered page while still emitting a Sphinx build-time
  # warning, so a *genuine* problem surfacing on stderr in the future is
  # still noticed by whoever runs the build, rather than being silently
  # swallowed.
  stderr_output: remove-warn

latex:
  latex_documents:
    targetname: immlib-docs.tex

sphinx:
  extra_extensions:
    - 'sphinx.ext.autodoc'
    - 'sphinx.ext.napoleon'
    - 'sphinx.ext.viewcode'
    - 'sphinx.ext.autosummary'
  config:
    add_module_names: False
    autosummary_generate: True
#bibtex_bibfiles:
#  - references.bib

repository:
  url: https://github.com/noahbenson/immlib
  path_to_book: docs
  branch: main

html:
  use_edit_page_button: true
  use_issues_button: true
  use_repository_button: true
