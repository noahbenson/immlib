################################################################################
# myst.yml
#
# Jupyter Book 2 configuration (it builds with mystmd and uses myst.yml rather
# than the Jupyter Book 1 _config.yml and _toc.yml).
version: 1

project:
  title: "immlib: An Immutable Scientific Workflow Library"
  authors:
    - name: Noah C. Benson
      email: nben@uw.edu
  copyright: "2025"
  github: https://github.com/noahbenson/immlib
  toc:
    - file: intro.md
    - title: Introduction
      children:
        - file: intro/about.md
        - file: intro/getting-started.md
        - file: license.md
    - title: User Guide
      children:
        - file: user-guide/design.md
        - file: user-guide/compatibility.md
        - file: user-guide/workflows.md
          children:
            - file: user-guide/workflows/plans.md
            - file: user-guide/workflows/planobjects.md
        - file: user-guide/io.md
        - file: user-guide/paths.md
        - file: user-guide/utils.md
          children:
            - file: user-guide/utils/numerical.md
            - file: user-guide/utils/units.md
            - file: user-guide/utils/strings.md
            - file: user-guide/utils/functional.md
            - file: user-guide/utils/predicates.md
            - file: user-guide/utils/other.md
        - file: user-guide/math.md
    # The API-reference pages are generated by docs/generate_api.py, which the
    # build runs before myst build.
    - title: API Reference
      children:
        - file: api.md
        - file: api/immlib.md
        - file: api/immlib-math.md
        - file: api/immlib-workflow.md
        - file: api/immlib-pathlib.md
        - file: api/immlib-iolib.md
        - file: api/immlib-types.md
        - file: api/immlib-util.md

site:
  template: book-theme
  options:
    logo: logo.svg
