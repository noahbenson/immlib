################################################################################
# tests.yml
#
# GitHub Actions Workflow for running the tests for the immlib library.
#
# by Noah C. Benson

name: CI

# We run on either pushes or pulls into main or dev branches
on:
  push:
    branches:
      - main
      - dev
      - "main/**"
      - "dev/**"
    paths-ignore:
      - '**/README.md'
      - '**/.gitignore'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/codecov.yml'
  pull_request:
    branches: [ main, dev ]
    paths-ignore:
      - '**/README.md'
      - '**/.gitignore'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/codecov.yml'
  # We sometimes want to run this manually.
  workflow_dispatch:
  # We also sometimes want to run this from another workflow.
  workflow_call:

# Our only job in this case is to test the code.
jobs:
  test:
    name: ${{matrix.version}}/${{matrix.os}}/${{matrix.arch}} - ${{github.event_name}}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
        os:
          - ubuntu-latest
        arch:
          - 'x64'
        include:
          # Note: these are run as x64, not x86 (32-bit): PyTorch does not
          # publish 32-bit/win32 wheels, so the x86 label used here
          # previously was misleading (the actual install below happens in
          # the 64-bit conda environment set up by Setup Miniconda anyway).
          - {"os": "windows-latest", "arch": "x64", "version": "3.10"}
          - {"os": "windows-latest", "arch": "x64", "version": "3.11"}
          - {"os": "windows-latest", "arch": "x64", "version": "3.12"}
          - {"os": "windows-latest", "arch": "x64", "version": "3.13"}
          - {"os": "windows-latest", "arch": "x64", "version": "3.14"}
          - {"os": "macos-latest", "arch": "arm64", "version": "3.10"}
          - {"os": "macos-latest", "arch": "arm64", "version": "3.11"}
          - {"os": "macos-latest", "arch": "arm64", "version": "3.12"}
          - {"os": "macos-latest", "arch": "arm64", "version": "3.13"}
          - {"os": "macos-latest", "arch": "arm64", "version": "3.14"}
    # The job environment.
    env:
      OS: ${{ matrix.os }}
      ARCH: ${{ matrix.arch }}
      PYTHON: ${{ matrix.version }}
    # The steps in the job.
    steps:
      # Check out the repository (goes to $GITHUB_WORKSPACE)
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: '2'
      # Setup the Python Environment.
      - name: Setup Python Environment
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.version }}
          architecture: ${{ matrix.arch }}
      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v4
        with:
          python-version: ${{ matrix.version }}
      - name: Install Numpy, Scipy, and PyTorch
        shell: bash -el {0}
        #run: |
        #  conda install \
        #      -cpytorch \
        #      -cconda-forge \
        #      'numpy >= 1.24' \
        #      'scipy >= 1.7' \
        #      'pytorch >= 2.2'
        run: |
          python -m pip install \
              'numpy >= 1.24' \
              'scipy >= 1.7' \
              'torch >= 2.2'
      # Log the Python Version
      - name: Display Python version
        shell: bash -el {0}
        run: |
          PYVER=$(python --version)
          TORCHVER=$(python -c 'import torch; print(torch.__version__)')
          NUMPYVER=$(python -c 'import numpy; print(numpy.__version__)')
          SCIPYVER=$(python -c 'import scipy; print(scipy.__version__)')
          echo "Versions:"
          echo "  - Python:  ${PYVER}"
          echo "  - PyTorch: ${TORCHVER}"
          echo "  - NumPy:   ${NUMPYVER}"
          echo "  - SciPy:   ${SCIPYVER}"
      # Run the actual tests.
      - name: Run Tests
        run: |
          pip install -e .[test]
          python -m immlib.test
        shell: bash -el {0}

  # Free-threaded (no-GIL) Python builds. Conda doesn't provide these, so this
  # job installs everything with pip into the free-threaded Python.
  test-freethreaded:
    name: ${{matrix.version}}/${{matrix.os}} (free-threaded) - ${{github.event_name}}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '3.14t'
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: '2'
      - name: Setup Python Environment
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.version }}
      - name: Install immlib and its dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[test]
      - name: Display Python version
        run: |
          python --version
          python -c 'import sys; print("GIL enabled:", sys._is_gil_enabled())'
      # Importing immlib and its dependencies must not re-enable the GIL.
      - name: Check that the GIL stays disabled
        run: |
          python -c 'import sys, immlib, immlib.math; assert not sys._is_gil_enabled(), "importing immlib enabled the GIL"'
      - name: Run Tests
        run: |
          python -m immlib.test
